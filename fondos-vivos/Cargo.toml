[package]
name = "fondo-vivo"
version = "1.0.0"
edition = "2021"
description = "Fondos de pantalla animados (shaders) para los estilos de COSMIC"
license = "MIT"

[dependencies]
smithay-client-toolkit = { version = "0.19", default-features = false, features = ["calloop"] }
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }
wayland-egl = "0.32"
khronos-egl = { version = "6", features = ["dynamic"] }
libloading = "0.8"
glow = "0.16"
png = "0.17"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
